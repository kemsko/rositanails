name: Publish Rosita on Firebase
on:
  workflow_dispatch:
  push:
    branches: [deploy-firebase]
permissions:
  contents: read
concurrency:
  group: rosita-firebase-hosting-live
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VITE_DEMO_MODE: 'false'
      VITE_API_URL: ${{ vars.ROSITA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check publishing authorization
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROSITANAILS }}
        run: |
          node -e 'const raw=process.env.FIREBASE_SERVICE_ACCOUNT; if(!raw) throw new Error("Falta FIREBASE_SERVICE_ACCOUNT_ROSITANAILS en los Repository secrets."); let key; try {key=JSON.parse(raw);} catch {throw new Error("El secreto de publicación debe contener el JSON de una cuenta de servicio.");} if(key.project_id!=="rositanails"||!key.client_email||!key.private_key) throw new Error("La cuenta de publicación debe pertenecer a rositanails y tener sus credenciales completas.");'
      - run: npm ci
      - run: npm test
      - run: npm run build:production
      - name: Verify the real API accepts firebaseapp.com
        run: node scripts/verify-production-api.mjs
      - name: Publish production to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROSITANAILS }}
          projectId: rositanails
          channelId: live
