name: Create Rosita Worker
on:
  workflow_dispatch:
  push:
    branches: [deploy-cloudflare]
permissions:
  contents: read
concurrency:
  group: rosita-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9e5ee14a9333e0fe09289912eddb1658'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credentials are configured
        run: |
          node -e 'if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) { console.error("Agregá CLOUDFLARE_API_TOKEN a los secrets de GitHub Actions. El Account ID ya está configurado."); process.exit(1); }'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - name: Require a new Worker without overwriting existing projects
        run: node scripts/check-new-worker.mjs
      - run: npm run worker:deploy
